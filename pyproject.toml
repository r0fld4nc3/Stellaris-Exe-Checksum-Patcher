[project]
name = "Stellaris-Exe-Checksum-Patcher"
version = "3.0.0"
description = "Patches the Stellaris binary so that playing Ironman mode with mods allows the collection of achievements."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Artur Rosario" }]
maintainers = [{ name = "Artur Rosario" }]
keywords = [
  "stellaris",
  "checksum",
  "patcher",
  "ironman",
  "mods",
  "save",
  "fix",
]
requires-python = ">= 3.13, <3.14" # 3.14 does not yet support PySide6

dependencies = [
  "PySide6-Essentials~=6.10.1",
  "requests~=2.34.2",
  "vdf~=3.4",
  "chardet~=5.2.0",
]

[project.urls]
Repository = "https://github.com/r0fld4nc3/Stellaris-Exe-Checksum-Patcher.git"

[dependency-groups]
dev = ["nuitka~=2.8.9", "pyinstaller~=6.18.0"]

[tool.uv]
# Minimum versions for indirect dependencies to stay above known security fixes.
# (Pulled in by requests/pyinstaller)
constraint-dependencies = [
  "urllib3>=2.8.0",
  "certifi>=2026.10.19",
  "idna>=3.15",
  "setuptools>=83.0.0",
]
