[project]
name = "Stellaris-Exe-Checksum-Patcher"
version = "3.1.0"
description = "Patches the Stellaris binary so that playing Ironman mode with mods allows the collection of achievements."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Artur Rosario" }]
maintainers = [{ name = "Artur Rosario" }]
keywords = [
  "stellaris",
  "checksum",
  "patcher",
  "ironman",
  "mods",
  "save",
  "fix",
]
requires-python = "~=3.14.0" # Enforce strict upper bound

dependencies = [
  "PySide6-Essentials~=6.12.0",
  "requests~=2.34.2",
  "vdf~=3.4.0",
  "chardet~=7.7.0",
]

[project.urls]
Repository = "https://github.com/r0fld4nc3/Stellaris-Exe-Checksum-Patcher.git"

[dependency-groups]
dev = ["nuitka~=4.3.5", "pyinstaller~=6.22.0"]

[tool.uv]
required-version = ">=0.9.17"
exclude-newer = "P7D"         # Ignore package versions uploaded less than x time ago

# Minimum versions for indirect dependencies to stay above known security fixes.
# (Pulled in by requests/pyinstaller)
constraint-dependencies = [
  "urllib3~=2.8.0",
  "certifi~=2026.10.23",
  "idna~=3.15",
  "setuptools~=84.2.0",
]
