# Builds the Windows, Linux and macOS executables with the scripts in builds/ and uploads them as artifacts.
#
# To start:
#   - Manually: GitHub > Actions > Build > Run workflow (pick the builder)
#   - From a tag: git tag v3.0.0 && git push origin v3.0.0
#
# Download the results from the run's "Artifacts" section.

name: Build

on:
  workflow_dispatch:
    inputs:
      builder:
        description: Which build script to run
        type: choice
        options: [all, nuitka, pyinstaller]
        default: all
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.builder }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PLATFORM: ${{ startsWith(matrix.os, 'windows') && 'windows' || startsWith(matrix.os, 'macos') && 'macos' || 'linux' }}

    strategy:
      fail-fast: false
      matrix:
        # Same Ubuntu version as builds/support/ubuntu.Dockerfile
        # macos-latest is Apple Silicon (arm64)
        os: [windows-latest, ubuntu-24.04, macos-latest]
        # Tags build everything. Manual run builds what was picked
        builder: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.builder != 'all') && format('["{0}"]', inputs.builder) || '["nuitka", "pyinstaller"]') }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # Based on builds/support/ubuntu.Dockerfile: compilers/patchelf for Nuitka, system libraries Qt loads
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache patchelf binutils file \
            libglib2.0-0 libdbus-1-3 libgl1 libegl1 libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-6 libx11-xcb1 libxrender1 libxi6 libxfixes3 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1 libxcb-util1

      - name: Install ccache (macOS)
        if: runner.os == 'macOS' && matrix.builder == 'nuitka'
        run: brew install ccache

      # Nuitka keeps everything it reuses in NUITKA_CACHE_DIR: ccache (Linux/macOS), clcache (Windows MSVC) and the tools it downloads. Caching this folder speeds up repeat Nuitka builds.
      # Tag builds only reuse caches from main, so a manual run on main keeps them warm.
      - name: Point Nuitka at a cache folder
        if: matrix.builder == 'nuitka'
        shell: bash
        run: |
          echo "NUITKA_CACHE_DIR=${RUNNER_TEMP}/nuitka-cache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"

      - name: Restore Nuitka cache
        if: matrix.builder == 'nuitka'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache
          # Each run saves a new entry (caches can't be overwritten) and restores the newest matching one
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            nuitka-${{ runner.os }}-

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python and dependencies
        run: uv sync --locked --all-extras --dev

      - name: Build
        run: uv run python builds/${{ matrix.builder }}.py -p ${{ env.PLATFORM }}

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        # Artifact upload drops symlinks and executable permissions inside .app bundles; ditto keeps them
        run: |
          for app in Stellaris-Checksum-Patcher-*.app; do
            ditto -c -k --keepParent "$app" "${app%.app}.zip"
            rm -rf "$app"
          done

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Stellaris-Checksum-Patcher-${{ matrix.builder }}-${{ env.PLATFORM }}
          path: Stellaris-Checksum-Patcher-*
          if-no-files-found: error
